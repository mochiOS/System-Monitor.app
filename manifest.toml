format = 1

[package]
provenance = "built-in"
id = "org.mochios.system-monitor"
name = "System Monitor"
version = "0.1.0"
revision = 1
vendor = "mochiOS"
kind = "application"
architecture = "x86_64"
abi = "mochios-1"

[application]
entry = "entry.elf"
description = "Inspect running processes and system activity"
icon = "appicon.png"
resources = ["appicon.png"]

[[binary]]
path = "/system/applications/SystemMonitor.app/entry.elf"
kind = "application"
requires = [
    "fs.read.applications",
    "ipc.client",
    "ipc.server",
    "window.create",
    "process.inspect",
]
